:root{--red:#d72305;--ink:#151514;--paper:#fff;--surface:#f5f5f3;--line:#252523;--soft:#deded9;--muted:#62625d;--site-font:Calibri,Aptos,"Segoe UI",Arial,sans-serif}*{box-sizing:border-box}html{background:var(--surface)}body{margin:0;min-width:320px;background:linear-gradient(90deg,var(--red) 0 7px,transparent 7px),var(--surface);color:var(--ink);font-family:var(--site-font)}.shell{min-height:100vh;padding:28px 32px 20px 39px}.header{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;max-width:1800px;margin:0 auto 22px}.kicker{margin:0 0 7px;color:#b91f05;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.header h1{margin:0;font-size:clamp(1.75rem,3vw,2.55rem);font-weight:650;letter-spacing:-.025em;line-height:1.05}.instruction{display:flex;align-items:center;gap:9px;margin:0 4px 2px 0;color:#555550;font-size:.98rem}.instruction-icon{color:var(--red);font-size:1.2rem}.diagram{position:relative;overflow:hidden;max-width:1800px;margin:0 auto;border:1px solid #c9c9c5;border-radius:10px;background:var(--paper);box-shadow:0 18px 50px rgba(20,20,18,.08)}.toolbar{position:absolute;z-index:20;top:14px;right:14px;display:flex;align-items:center;gap:6px;padding:6px;border:1px solid #d6d6d2;border-radius:8px;background:rgba(255,255,255,.96);box-shadow:0 6px 18px rgba(20,20,18,.08)}.tool-button{min-width:40px;height:40px;padding:0 12px;border:1px solid #d2d2ce;border-radius:5px;background:#fff;color:#222;font-weight:600;cursor:pointer}.tool-button:hover,.tool-button:focus-visible{background:#fbe9e6;outline:3px solid rgba(215,35,5,.18);outline-offset:1px}.zoom-value{min-width:52px;padding:0 8px;color:#656560;font-size:.85rem;font-variant-numeric:tabular-nums;text-align:center}.viewport{overflow:auto;min-height:min(74vh,850px);max-height:calc(100vh - 170px);padding:34px 24px 28px;scrollbar-color:#9a9a94 #efefec;scrollbar-width:thin}.stage-space{position:relative;margin:0 auto}.stage{position:absolute;inset:0 auto auto 0;transform-origin:top left}.connectors{position:absolute;inset:0;overflow:visible;color:var(--line);pointer-events:none}.connectors>path{fill:none;stroke:currentColor;stroke-linecap:square;stroke-linejoin:miter;stroke-width:1.7;vector-effect:non-scaling-stroke}.node{position:absolute;z-index:2;display:grid;place-items:center;padding:10px;border:1.7px solid #000000;border-radius:5px;background:#fff;color:#171716;box-shadow:0 3px 0 rgba(20,20,18,.05);cursor:pointer;transition:box-shadow .14s ease,transform .14s ease}.node span{display:block;font-size:15px;font-weight:600;line-height:1.22;text-align:center;white-space:pre-line}.node:hover{z-index:4;box-shadow:0 7px 18px rgba(215,35,5,.14);transform:translateY(-2px)}.node:focus-visible{z-index:5;outline:4px solid rgba(215,35,5,.22);outline-offset:3px}.node-question,.node-result{border-width:2px}.node-question span{font-size:23px;font-weight:700;letter-spacing:-.01em}.node-decision span{font-size:18px;font-weight:700}.node-branch{background:#f7f7f5}.node-level span{font-size:14px}.node-path{border-style:solid}.drawer{width:min(92vw,520px);max-width:none;height:100vh;max-height:100vh;margin:0 0 0 auto;padding:0;border:0;border-left:1px solid #cacac6;background:#fff;box-shadow:-20px 0 55px rgba(20,20,18,.16)}.drawer::backdrop{background:rgba(0,0,0,.48)}.drawer-close{position:absolute;top:18px;right:18px;width:40px;height:40px;border:1px solid #d2d2ce;border-radius:50%;background:#fff;color:#222;font-size:1.35rem;cursor:pointer}.drawer-close:hover,.drawer-close:focus-visible{border-color:#111;outline:3px solid rgba(215,35,5,.2)}.detail-header{padding:55px 34px 26px;border-bottom:1px solid var(--soft)}.detail-title{max-width:390px;margin:0;font-size:clamp(1.8rem,4vw,2.45rem);font-weight:650;letter-spacing:-.025em;line-height:1.08}.detail-description{margin:14px 0 0;color:#3f3f3c;font-size:1.05rem;line-height:1.58}.detail-body{display:grid;gap:22px;padding:26px 34px 42px}.detail-image{display:block;width:100%;max-height:360px;object-fit:cover;border:1px solid #d2d2ce;border-radius:7px;background:#f2f2ef}.detail-link{display:inline-flex;width:max-content;align-items:center;min-height:44px;padding:10px 16px;border:1.5px solid #181817;border-radius:5px;background:#fff;color:#181817;font-weight:700;text-decoration:none}.detail-link:hover,.detail-link:focus-visible{background:#fbe9e6;outline:3px solid rgba(215,35,5,.18);outline-offset:2px}.drawer[open]{animation:slide-in .2s ease-out}@keyframes slide-in{from{transform:translateX(25px);opacity:0}to{transform:none;opacity:1}}@media(max-width:760px){body{background:linear-gradient(90deg,var(--red) 0 5px,transparent 5px),var(--surface)}.shell{padding:20px 14px 14px 20px}.header{display:block;margin-bottom:16px}.instruction{margin-top:12px;font-size:.9rem}.toolbar{position:sticky;top:0;right:auto;left:0;width:max-content;margin:10px}.viewport{min-height:68vh;max-height:72vh;padding:18px 16px 24px}.detail-header{padding:50px 24px 22px}.detail-body{padding:22px 24px 34px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}


.overview-area{max-width:1800px;margin:0 auto 22px;padding:24px;border:1px solid #c9c9c5;border-radius:10px;background:#fff;box-shadow:0 12px 34px rgba(20,20,18,.06)}
.overview-intro{display:grid;grid-template-columns:minmax(270px,.72fr) minmax(340px,1.28fr);align-items:end;gap:28px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--soft)}
.overview-kicker{margin:0 0 5px;color:#b91f05;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.overview-intro h2{margin:0;font-size:clamp(1.4rem,2.3vw,2rem);font-weight:700;letter-spacing:-.02em}
.overview-intro>p{max-width:780px;margin:0;color:#454542;font-size:1.04rem;line-height:1.5}
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.overview-card{position:relative;display:flex;min-width:0;flex-direction:column;gap:15px;padding:21px 22px 20px;border:1.5px solid #111;border-top-width:5px;border-radius:7px;background:#fff}
.overview-card-direct{border-top-color:var(--red)}
.overview-card-indirect{border-top-color:#31312e;background:#fafaf9}
.overview-card-head{display:grid;grid-template-columns:42px 1fr;align-items:start;gap:12px}
.overview-number{display:grid;place-items:center;width:40px;height:40px;border:1.5px solid currentColor;border-radius:50%;color:var(--red);font-size:.83rem;font-weight:800;letter-spacing:.04em}
.overview-card-indirect .overview-number{color:#31312e}
.overview-title{margin:0 0 3px;color:#b91f05;font-size:.82rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.overview-card-indirect .overview-title{color:#42423e}
.overview-card h3{margin:0;font-size:clamp(1.12rem,1.5vw,1.38rem);font-weight:700;line-height:1.2}
.overview-summary{margin:0;color:#333330;font-size:1rem;line-height:1.48}
.overview-region{padding:13px 14px;border-left:4px solid var(--red);background:#fbe9e6}
.overview-card-indirect .overview-region{border-left-color:#555550;background:#ededeb}
.overview-region>p{margin:0 0 9px;font-size:.91rem;font-weight:700;line-height:1.35}
.region-chips{display:flex;flex-wrap:wrap;gap:7px}
.region-chip{padding:6px 9px;border:1px solid rgba(21,21,20,.34);border-radius:999px;background:#fff;color:#222;font-size:.84rem;font-weight:700;line-height:1.2}
.overview-path{display:grid;grid-template-columns:repeat(var(--step-count,3),minmax(0,1fr));gap:24px;margin:1px 0 0;padding:0;list-style:none;counter-reset:path-step}
.overview-path li{position:relative;display:grid;align-content:start;justify-items:center;gap:7px;min-width:0;text-align:center;font-size:.87rem;font-weight:700;line-height:1.25;counter-increment:path-step}
.overview-path li::before{content:counter(path-step);display:grid;place-items:center;width:30px;height:30px;border:1.5px solid #111;border-radius:50%;background:#fff;color:#111;font-size:.76rem}
.overview-path li:not(:last-child)::after{content:"→";position:absolute;top:4px;right:-20px;color:var(--red);font-size:1.15rem;font-weight:800}
.overview-card-indirect .overview-path li:not(:last-child)::after{color:#4d4d49}
.route-options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:-2px}
.route-options[hidden]{display:none}
.route-option{position:relative;padding:10px 10px 10px 39px;border:1px solid #b9b9b4;border-radius:5px;background:#fff;color:#343431;font-size:.84rem;line-height:1.33}
.route-option::before{content:"oder";position:absolute;top:10px;left:8px;color:#a51d05;font-size:.7rem;font-weight:800;text-transform:uppercase}
.route-option:first-child::before{content:"Weg 1"}
.route-option:nth-child(2)::before{content:"Weg 2"}
.overview-extra{margin:auto 0 0;padding-top:12px;border-top:1px solid #d7d7d3;color:#4d4d49;font-size:.87rem;line-height:1.42}
.overview-note{display:grid;grid-template-columns:30px 1fr;align-items:start;gap:10px;margin-top:18px;padding:14px 16px;border:1px solid #c9c9c5;border-radius:6px;background:#f5f5f3}
.note-icon{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-family:Georgia,serif;font-size:1rem;font-weight:700}
.overview-note p{margin:1px 0 0;color:#3f3f3c;font-size:.91rem;line-height:1.45}
.overview-note a{color:#8f1a06;font-weight:700;text-underline-offset:2px}
.drawer-overview{width:min(94vw,720px)}
.drawer-overview .detail-header{padding-bottom:22px}
.drawer-overview .detail-description{max-width:600px;font-weight:700;line-height:1.42}
.drawer-overview .detail-body{gap:0;padding-top:24px}
.detail-overview{display:grid;gap:18px;padding-top:18px;border-top:5px solid var(--red)}
.detail-overview[hidden]{display:none}
.detail-overview-indirect{border-top-color:#333330}
.overview-context{margin:0;color:#5a5a55;font-size:.93rem;line-height:1.45}
.detail-overview .overview-summary{font-size:1.02rem}
.detail-overview-indirect .overview-region{border-left-color:#555550;background:#ededeb}
.detail-overview-indirect .overview-path li:not(:last-child)::after{color:#4d4d49}
.detail-overview .overview-note{margin-top:0}
@media(max-width:980px){.overview-grid{grid-template-columns:1fr}.overview-intro{grid-template-columns:1fr;align-items:start;gap:8px}.overview-card{padding:19px}}
@media(max-width:620px){.overview-area{padding:18px}.overview-path{grid-template-columns:1fr;gap:9px}.overview-path li{grid-template-columns:30px 1fr;align-items:center;justify-items:start;text-align:left}.overview-path li:not(:last-child)::after{content:"↓";top:24px;right:auto;left:10px}.route-options{grid-template-columns:1fr}.overview-card-head{grid-template-columns:36px 1fr}.overview-number{width:34px;height:34px}}
.detail-link[hidden],.detail-image[hidden],.detail-overview[hidden],.overview-source[hidden]{display:none!important}</style></head>

st grundsätzlich direkt möglich.","summary":"Der Schulabschluss wird in Deutschland als Hochschulreife (Hochschulzugangsberechtigung) anerkannt. Sind auch die Sprach- und weiteren Zugangsvoraussetzungen des Studiengangs erfüllt, ist eine direkte Bewerbung möglich.","regionLabel":"In der Regel stammen ausländische Schulabschlüsse, die in Deutschland als direkte Hochschulzugangsberechtigung anerkannt werden, aus:","regions":["EU-Mitgliedstaaten","Island · Liechtenstein · Norwegen","Schweiz"],"steps":["Schulabschluss","Bewerbung auf einen Studienplatz","Studium"],"routes":[],"extra":"Auch ein Abitur, das an einer deutschen Schule im Ausland erworben wurde, stellt eine direkte HZB dar. Auch ein International Baccalaureate Diploma/Diplôme du Baccalauréat International (IB) kann einer direkte HZB entsprechen."},"indirect":{"title":"Indirekte HZB","status":"Der Studienstart ist grundsätzlich nicht direkt möglich.","summary":"Der Schulabschluss reicht allein meist nicht für den direkten Studienstart in Deutschland aus. Die Hochschulzugangsberechtigung muss zunächst über einen vorbereitenden Weg erworben werden.","regionLabel":"In der Regel stammen ausländische Schulabschlüsse, die in Deutschland als indirekte Hochschulzugangsberechtigung anerkannt werden, aus:","regions":["EU-Ausland ohne Schweiz","Nicht-Mitgliedsstaaten im EWR"],"steps":["Schulabschluss","Studienkolleg","Bewerbung auf einen Studienplatz","Studium"],"routes":["DINT (Probestudium)","VORsprung (Kostenfreies, digitales Studienvorbereitungsprogramm des DAAD)"],"extra":"DINT als Probestudium gemäß § 8 HZaBVO dient dem Erwerb der fach- und hochschulgebundenen HZB und wird von der HKA durchgeführt und anerkannt. VORsprung stellt ein digitales Alternativangebot zum traditionellen Studienkolleg dar und wird von der HKA im Rahmen der hochschulindividuellen Zugangsprüfung gemäß § 6 HZaBVO anerkannt."},"note":"Maßgeblich sind Art und Herkunft des Schulabschlusses, nicht die Staatsangehörigkeit der Studieninteressierten. Die Ländergruppen bieten nur eine erste Orientierung; verbindlich entscheidet immer die Hochschule.","sourceLabel":"Zulassungsdatenbank - DAAD","sourceUrl":"https://www.daad.de/de/in-deutschland-studieren/voraussetzungen/zulassungsdatenbank/"},"diagramSize":{"width":1940,"height":1040},"nodes":[{"id":"root","label":"Befähigt der ausländische Schulabschluss im Herkunftsland zu einem Studium?","x":370,"y":24,"width":1200,"height":72,"kind":"question","section":"Ausgangspunkt","detail":"Ausgangspunkt ist die Frage, ob der ausländische Schulabschluss eine Hochschulzugangsberechtigung umfasst.","description":"Voraussetzung für die Einordnung in direkte und indirekte Hochschulzugangsberechtigungen ist, dass der ausländische Bildungsnachweis im Herkunftsland die/den Studieninteressierte:n zu einem Studium befähigt.\nLiegt eine solche Befähigung nicht vor, ist kein Studium möglich.","link":"","linkLabel":"Weitere Informationen","image":"","imageAlt":"","backgroundColor":"#ffffff","textColor":"#171716","borderColor":"#000000"},{"id":"yes","label":"Ja","x":275,"y":145,"width":160,"height":62,"kind":"decision","section":"Entscheidung","detail":"Bei vorhandener Hochschulzugangsberechtigung wird zwischen einer direkten und einer indirekten HZB unterschieden.","description":"Bei einem Schulabschluss, der in irgendeiner Form zu einem Studium befähigt, muss zwischen einer direkten und einer indirekten Hochschulzugangsberechtigung (HZB) unterschieden werden.","link":"","linkLabel":"Weitere Informationen","image":"","imageAlt":"","backgroundColor":"#ffffff","textColor":"#171716","borderColor":"#000000"},{"id":"no","label":"Nein","x":1530,"y":145,"width":160,"height":62,"kind":"decision","section":"Entscheidung","detail":"Ohne Hochschulzugangsberechtigung führt dieser Zweig im dargestellten Verfahren nicht zu einem Studium.","description":"Ohne Schulabschluss, der in irgendeiner Form zu einem Studium befähigt, kann leider kein Studium aufgenommen werden.","link":"","linkLabel":"Weit
